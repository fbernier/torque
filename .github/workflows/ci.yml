name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  TORQUE_BUILD: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The vendored crate carries its own `[workspace]`, so none of the above
      # reaches it. Its root also disables every lint for upstream code, which
      # is why the clippy run below needs no `-D warnings`: the Torque-owned
      # module re-enables and denies them itself, and nothing else here would
      # report anything.
      - run: cargo fmt --manifest-path native/sonic-rs/Cargo.toml --check
      - run: cargo clippy --manifest-path native/sonic-rs/Cargo.toml --lib

  test:
    name: Test (OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Every pair must exist in setup-beam's compatibility table. The
          # newest row also exercises current ERTS flatmap behavior.
          - otp: "29"
            elixir: "1.20"
          - otp: "28"
            elixir: "1.19"
          - otp: "27"
            elixir: "1.18"
          - otp: "26"
            elixir: "1.17"
          # Oldest Elixir version declared by the package.
          - otp: "26"
            elixir: "1.15"
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: dtolnay/rust-toolchain@stable

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  # Run unsafe pointer-range and unaligned prefix-load paths on the same arm64
  # architecture used for release artifacts, not only through cross-compilation.
  arm64:
    name: Test (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - uses: dtolnay/rust-toolchain@stable

      - run: mix deps.get
      # Rust unit tests directly cover the architecture-sensitive prefix loads.
      - run: cargo test --workspace
      - run: mix test
        env:
          TORQUE_BUILD: "true"

  # Wall-clock regressions run separately from the functional matrix.
  #
  # Pin the legacy job before the OTP fix for erlang/otp#10975 so it exercises
  # the large-map duplicate-key workaround. Retire this row with the workaround.
  legacy_otp:
    name: Test (OTP 28.4.3, before erlang/otp#10976)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4.3"
          elixir-version: "1.19"
          version-type: strict

      - uses: dtolnay/rust-toolchain@stable

      - run: mix deps.get
      - run: mix test
        env:
          TORQUE_BUILD: "true"

  # Run key-order throughput checks on current ERTS; functional tests cannot
  # observe this correctness-neutral optimization.
  perf:
    name: Key-order timing regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: dtolnay/rust-toolchain@stable

      - run: mix deps.get
      - run: mix test --only perf
        env:
          TORQUE_BUILD: "true"
