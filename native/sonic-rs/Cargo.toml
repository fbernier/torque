# Vendored sonic-rs 0.5.8 with Torque-specific changes:
#   * public `JsonVisitor` exports
#   * `parse_into_visitor` entry added, so Torque can build Erlang terms
#     directly during the native SIMD parse (one pass, zero-copy strings)
#     instead of going through the slower serde path
#   * a shared nesting limit for DOM and visitor parsing that returns an error
#     before stack exhaustion
#   * a `JsonVisitor::visit_overflow_int` hook: integer-shaped tokens that
#     overflow i64/u64 are routed to it with the raw digits (default falls
#     back to f64), so Torque can build exact Erlang bignums during decode
#   * key-specific visitor hooks with backward-compatible string defaults
#   * one document-size check shared by serde and visitor entry points
#   * structured recursion-limit detection for callers
#   * negative-zero restoration only at float conversion sites
#   * reusable multi-path extraction with optional structural skipping and
#     indexed construction for wide plan nodes
#   * shared nesting enforcement for validated structural skips
#   * `skip_one_value_at` skips without materialising the skipped bytes, for
#     the callers that discard them
#   * validated skips reject invalid Unicode escapes and non-finite numbers
#   * `skip_member` takes scalar container members without a recursive frame
#   * `Read` caches the pinned input's slice pointer instead of resolving it
#     through the `PinnedInput` enum on every `peek`/`at`/`eat`/`remain`
#
# Upstream disables clippy for this crate. Tests cover Torque-owned patches
# because the linter cannot report on them.

# Standalone manifest so this is not pulled into the torque workspace.
[workspace]

[package]
edition = "2021"
name = "sonic-rs"
version = "0.5.8"
authors = ["Volo Team <volo@cloudwego.io>"]
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Sonic-rs is a fast Rust JSON library based on SIMD (vendored, patched for Torque)"
license = "Apache-2.0"
repository = "https://github.com/cloudwego/sonic-rs"

[lib]
name = "sonic_rs"
path = "src/lib.rs"

[dependencies]
ahash = "0.8"
bumpalo = "3.19"
bytes = "1.10"
cfg-if = "1.0"
faststr = { version = "0.2", features = ["serde"] }
itoa = "1.0"
ref-cast = "1.0"
serde = { version = "1.0", features = ["rc", "derive"] }
simdutf8 = "0.1"
sonic-number = "0.1"
sonic-simd = "0.1"
thiserror = "2.0"
zmij = "1.0"

[features]
arbitrary_precision = []
avx512 = ["sonic-simd/avx512"]
default = []
non_trailing_zero = []
sanitize = []
sort_keys = []
utf8_lossy = []
